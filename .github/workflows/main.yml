# .github/workflows/build.yaml
name: pynapple CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: 'Open a tmate session if the documentation build fails'
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        # exclude:
        #   - os: macos-latest
        #     python-version: 3.7
        #   - os: windows-latest
        #     python-version: 3.7
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Test
        run: |
          coverage run --source=pynapple --branch -m pytest tests/
          coverage report -m

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
            token: ${{ secrets.CODECOV_TOKEN }}

  documentation:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,doc]
      - name: Build documentation
        run: |          
          cd doc
          make html
      # Only on a manual run with debug_tmate enabled: on pull_request this
      # input is empty, so a failed build fails fast instead of holding the
      # runner open until the 6h job limit.
      - name: Start tmate session for debugging
        if: failure() && inputs.debug_tmate
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check external links in Markdown files
        run: ./scripts/check_markdown_links.sh external

      - name: Check html
        uses: chabad360/htmlproofer@master
        with:
          directory: "doc/_build/html"
          # The directory to scan
          arguments: 
            --checks Links,Scripts 
            --ignore-urls "https://fonts.gstatic.com,/scikit-learn\.org/,https://mkdocs-gallery.github.io,./doc/_build/html/_static/,https://www.nature.com/articles/s41593-022-01020-w,https://elifesciences.org/reviewed-preprints/85786" 
            --assume-extension 
            --check-external-hash 
            --ignore-status-codes 403,0,429,503
            --ignore-files "/.+\/html\/_static\/.+/"
          # The arguments to pass to HTMLProofer

  doctest:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run doctests
        run: |
          pytest --doctest-modules pynapple/core pynapple/process

  check:
    if: always()
    needs:
    - lint
    - test
    - doctest
    - documentation
    runs-on: ubuntu-latest
    steps:
    - name: Decide whether all tests and notebooks succeeded
      uses: re-actors/alls-green@afee1c1eac2a506084c274e9c02c8e0687b48d9e # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}
