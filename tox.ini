[tox]
isolated_build = True
envlist = py310,py311,py312,py313
requires = tox-conda

[testenv]
extras = dev
commands =
    ruff check pynapple tests
    ruff format --check pynapple tests
    coverage run --source=pynapple --branch -m pytest tests/
    coverage report -m

[testenv:codespell]
description = Check spelling with codespell (config in pyproject.toml)
skip_install = true
deps = codespell[toml]
commands = codespell {posargs}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

