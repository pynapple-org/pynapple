[build-system]
requires      = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pynapple"
dynamic = ["version"]
description = "PYthon Neural Analysis Package Pour Laboratoires d’Excellence"
readme = "README.md"
authors = [{ name = "Guillaume Viejo", email = "guillaume.viejo@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: MIT License",
        "Natural Language :: English",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.8",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
]
keywords = ["neuroscience"]
dependencies = [
    "pandas>1.0.3",
    "numpy>=1.17.4",
    "scipy>=1.3.2",
    "numba>=0.46.0",
    "numba>=0.53.0; python_version >= '3.9'",
    "numba>=0.55.0; python_version >= '3.10'",
    "numba>=0.57.0; python_version >= '3.11'",
    "numba>=0.59.0; python_version >= '3.12'",
    "numba>=0.61.0; python_version >= '3.13'",
    "pynwb>=2.0.0",
    "tabulate",
    "h5py",
    "rich",
    "xarray>=2023.1.0",
    "neo",
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["pynapple", "pynapple.*"]

[tool.setuptools_scm]
version_scheme = 'no-guess-dev'
local_scheme = 'no-local-version'

[project.urls]
homepage = "http://pynapple.org/"
documentation = "http://pynapple.org/"
repository = "https://github.com/pynapple-org/pynapple"

##########################################################################
# Optional dependencies
##########################################################################
[project.optional-dependencies]
jax = [
    "pynajax; python_version >= '3.11'"
]
dev = [
    "ruff",         # Formatting, linting, ...
    "pip-tools",    # Dependency management
    "pytest",       # Testing framework
    "coverage",     # Test coverage measurement
    "matplotlib",   # Plots
]
doc = [
    "matplotlib",
    "zarr",
    "seaborn",
    "tqdm",
    "numpydoc",
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-issues",
    "sphinxcontrib-apidoc",
    "myst-parser",
    "myst-nb",
    "dandi",
    "sphinx-autobuild",
    "sphinx-contributors",
    "scikit-learn",
    # "sphinx-excec-code"
]
#docs = [
#    "mkdocs",                       # Documentation generator
#    "mkdocstrings[python]",         # Python-specific plugin for mkdocs
#    "mkdocs-section-index",         # Plugin for generating a section index in mkdocs
#    "mkdocs-gen-files",             # Plugin for generating additional files in mkdocs
#    "mkdocs-literate-nav",          # Plugin for literate-style navigation in mkdocs
#    "mkdocs-gallery",               # Plugin for adding image galleries to mkdocs
#    "mkdocs-material",
#    "matplotlib",
#    "seaborn",
#    "zarr",
#    "dandi"
#]
dandi = [
    "dandi",                        # Dandi package
    "fsspec",
    "requests",
    "aiohttp",
]

[tool.coverage.run]
omit = [
    "pynapple/io/cnmfe.py",
    "pynapple/io/neurosuite.py",
    "pynapple/io/phy.py",
    "pynapple/io/suite2p.py",
    "pynapple/core/_jitted_functions.py" # coverage doesn't work with numba
]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.pdf,*.svg,versioneer.py,doc/_build,*.lock'
check-hidden = true
# Ignore embedded base64 images in notebooks
ignore-regex = '^\s*"image/\S+": ".*'
# adn: Anterior Dorsal nucleus (neuroanatomy, see doc/examples/tutorial_HD_dataset.md)
# countin: variable name in _jitted_functions.py meaning "count in"
# nin: numpy ufunc attribute (ufunc.nin = number of inputs)
ignore-words-list = 'adn,countin,nin,thw'

[tool.ruff]
line-length = 88
extend-exclude = [
    ".eggs",
    ".hg",
    ".tox",
    "_build",
    "buck-out",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = [
    "E203",
    "E231",
    "E266",
    "E501",
    "W291",
    "W293",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"doc/**" = ["E", "F", "W", "C90"]
"docs/**" = ["E", "F", "W", "C90"]
"**/__init__.py" = ["E", "F", "W", "C90"]
"tests/**" = ["E", "F", "W", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
exclude = ["examples/**"]
